<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />

    <!-- Default SEO meta tags (overridden by react-helmet-async per page) -->
    <meta
      name="description"
      content="Plan your hiking and backpacking trips with TrekList. Create gear lists, track pack weight, and share your setup with fellow trekkers."
    />
    <link rel="canonical" href="https://treklist.co/" />

    <!-- Open Graph defaults -->
    <meta property="og:title" content="TrekList" />
    <meta
      property="og:description"
      content="Plan your hiking and backpacking trips with TrekList. Create gear lists, track pack weight, and share your setup with fellow trekkers."
    />
    <meta
      property="og:image"
      content="https://res.cloudinary.com/treklist/image/upload/c_fill,g_auto,w_1200,h_630,f_jpg,q_auto/gear-list-hero-images/hero-hiker-cinque-torri_hpe3lz"
    />
    <meta property="og:url" content="https://treklist.co/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="TrekList" />

    <!-- Twitter Card defaults -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="TrekList" />
    <meta
      name="twitter:description"
      content="Plan your hiking and backpacking trips with TrekList. Create gear lists, track pack weight, and share your setup with fellow trekkers."
    />
    <meta
      name="twitter:image"
      content="https://res.cloudinary.com/treklist/image/upload/c_fill,g_auto,w_1200,h_630,f_jpg,q_auto/gear-list-hero-images/hero-hiker-cinque-torri_hpe3lz"
    />

    <!-- Faster Cloudinary connection setup -->
    <link rel="preconnect" href="https://res.cloudinary.com" />
    <link rel="dns-prefetch" href="https://res.cloudinary.com" />

    <!-- Site verification -->
    <meta name="verification" content="a42a3faa5725cff8fe02e4613861678d" />

    <title>TrekList</title>
  </head>
  <body class="no-ios-zoom">
    <div id="root"></div>
    <!-- Unregister any stale service workers from previous app versions -->
    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(registrations) {
          for (var r of registrations) { r.unregister(); }
        });
      }
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
