[build]
  command = "npm run build"
  publish = "dist"

# Edge Functions configuration
[[edge_functions]]
  path = "/"
  function = "landing"

[[edge_functions]]
  path = "/share/*"
  function = "og-tags"

# Proxy API calls to your Render API subdomain
[[redirects]]
  from = "/api/*"
  to = "https://api.treklist.co/api/:splat"
  status = 200
  force = true

# SPA fallback so deep links like /login work on refresh
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
